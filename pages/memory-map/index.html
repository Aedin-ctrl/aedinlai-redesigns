<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aedin Lai — memory map</title>
<meta name="description" content="A personal page laid out as an address space, from reset vector to stack.">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#101217">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23151821'/%3E%3Cg fill='%237aa2f7'%3E%3Crect x='7' y='5' width='18' height='4'/%3E%3Crect x='7' y='12' width='18' height='7'/%3E%3Crect x='7' y='22' width='18' height='5'/%3E%3C/g%3E%3C/svg%3E">
<style>
  @font-face{font-family:'IBMPlexMono';src:url('../../fonts/IBMPlexMono-latin.woff2') format('woff2');font-weight:100 700;font-display:swap;}
  @font-face{font-family:'SpaceGrotesk';src:url('../../fonts/SpaceGrotesk-latin.woff2') format('woff2');font-weight:300 700;font-display:swap;}

  :root{
    --void:#101217; --bank:#171a23; --cell:#1d212c; --ink:#e6e9f0; --soft:#b8c0ce;
    --quiet:#9aa4b5; --faint:#8a94a6; --rule:#2a2f3c;
    --rom:#7aa2f7; --ram:#9ece6a; --io:#e0af68; --stack:#bb9af7;
    --ease:cubic-bezier(.25,.85,.3,1);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;}
  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto;}}
  body{
    font-family:'SpaceGrotesk',system-ui,sans-serif;color:var(--ink);line-height:1.6;
    background:var(--void);min-height:100svh;overflow-x:hidden;
    padding:clamp(14px,3vw,40px);
  }
  ::selection{background:var(--rom);color:#0a0d14;}

  body::before{
    content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;
    background:
      radial-gradient(44% 36% at 16% 8%, rgba(122,162,247,.10), transparent 68%),
      radial-gradient(40% 34% at 86% 90%, rgba(158,206,106,.08), transparent 70%);
    animation:bus 46s ease-in-out infinite alternate;
  }
  @keyframes bus{from{transform:translate3d(-2%,-1%,0) scale(1)}to{transform:translate3d(2.5%,1.6%,0) scale(1.06)}}

  .machine{max-width:1100px;margin:0 auto;}
  header{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;flex-wrap:wrap;
         border-bottom:1px solid var(--rule);padding-bottom:14px;margin-bottom:24px;}
  h1{font-weight:700;letter-spacing:-.038em;font-size:clamp(32px,6vw,56px);line-height:.95;}
  header .cpu{font-family:'IBMPlexMono',monospace;font-size:10.5px;letter-spacing:.11em;
              text-transform:uppercase;color:var(--faint);text-align:right;line-height:1.8;}

  .deck{display:grid;grid-template-columns:minmax(210px,.56fr) minmax(0,1.44fr);
        gap:clamp(16px,2.8vw,34px);align-items:start;}
  @media (max-width:800px){.deck{grid-template-columns:1fr;}}

  /* ---- the map: proportional to the actual sizes, which is the point of drawing one ---- */
  .map{position:sticky;top:clamp(14px,3vw,40px);
       border:1px solid var(--rule);border-radius:7px;overflow:hidden;background:var(--bank);}
  .seg{
    display:block;width:100%;text-align:left;font:inherit;cursor:pointer;
    background:var(--cell);border:0;border-bottom:1px solid var(--void);
    padding:10px 13px;color:var(--soft);position:relative;
    transition:background 180ms var(--ease), color 180ms var(--ease);
  }
  .seg:last-child{border-bottom:0;}
  .seg::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--hue);
               transform:scaleX(1);transform-origin:left;transition:width 180ms var(--ease);}
  .seg:hover,.seg[data-on="true"]{background:#242936;color:var(--ink);}
  .seg[data-on="true"]::before{width:5px;}
  .seg .addr{font-family:'IBMPlexMono',monospace;font-size:11px;color:var(--faint);
             letter-spacing:.03em;display:block;}
  .seg[data-on="true"] .addr{color:var(--hue);}
  .seg .nm{font-size:13.5px;font-weight:600;letter-spacing:-.01em;}
  .seg .sz{font-family:'IBMPlexMono',monospace;font-size:10.5px;color:var(--faint);float:right;
           font-variant-numeric:tabular-nums;}

  .ruler{display:flex;justify-content:space-between;margin-top:9px;
         font-family:'IBMPlexMono',monospace;font-size:10px;letter-spacing:.08em;
         text-transform:uppercase;color:var(--faint);}

  /* ---- the segments, written out ---- */
  .banks > section{
    scroll-margin-top:clamp(14px,3vw,40px);
    border:1px solid var(--rule);border-radius:7px;background:var(--bank);
    padding:clamp(16px,2.6vw,24px);margin-bottom:14px;position:relative;overflow:hidden;
  }
  .banks > section::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
                           background:var(--hue);}
  .banks .range{font-family:'IBMPlexMono',monospace;font-size:11px;letter-spacing:.05em;
                color:var(--hue);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  .banks .range span:last-child{color:var(--faint);}
  .banks h2{font-size:clamp(18px,2.5vw,24px);font-weight:700;letter-spacing:-.025em;
            margin:5px 0 9px;text-wrap:balance;}
  .banks p{font-size:14.5px;color:var(--soft);margin-bottom:10px;max-width:62ch;text-wrap:pretty;}
  .banks strong{color:var(--ink);font-weight:600;}
  .banks .words{display:flex;flex-wrap:wrap;gap:5px 7px;margin-top:12px;}
  .banks .words code{
    font-family:'IBMPlexMono',monospace;font-size:11.5px;color:var(--quiet);
    border:1px solid var(--rule);border-radius:4px;padding:2px 8px;background:var(--cell);
  }

  :focus-visible{outline:2px solid var(--rom);outline-offset:3px;border-radius:4px;}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none !important;transition:none !important;}
  }
</style>
</head>
<body>
<div class="machine">

  <header>
    <h1>Aedin Lai</h1>
    <p class="cpu">AL&#8209;2026 &middot; 16-bit address space<br>Electrical &amp; computer engineering</p>
  </header>

  <div class="deck">
    <div>
      <div class="map" id="map"></div>
      <p class="ruler"><span>0x0000 reset</span><span>0xFFFF stack top</span></p>
    </div>
    <div class="banks" id="banks"></div>
  </div>
</div>

<script>
(() => {
  // The map and the text are the same array, so a segment can never be drawn at one address and
  // described at another. The block heights are proportional to the real ranges.
  const MAP = [
    { id:'rom', hue:'--rom', from:0x0000, to:0x1FFF, name:'ROM — what it boots into',
      lead:'Electrical and computer engineering at Northeastern. The part that does not change.',
      body:['I build the measuring end of things — <strong>instrumentation that has to be right</strong>, and the software that makes sense of what it reads. The appeal is not the cleverness available at that end of a system; it is that the work is checkable. Either the reading is the reading that happened, or it is not.'],
      words:['Northeastern','ECE','Boston'] },
    { id:'ram', hue:'--ram', from:0x2000, to:0x9FFF, name:'RAM — what is running',
      lead:'The working set: 2025 at SingleStore, and research hardware published in JAMA.',
      body:['A season on data centre infrastructure, where a private cloud platform went from <strong>160 virtual machines to over 300</strong>. The count is not the interesting part; the tooling written along the way is what made the growth survivable rather than merely possible.',
            'The same year, research hardware built with the Yale School of Medicine and the PEACE Foundation for a neurology study, co-authored and published. The requirement was not sophistication — it was that a reading taken in a clinic be the reading that actually happened.'],
      words:['Python','Java','C#','SQL','MATLAB','JavaScript','Pandas','Linux','Git'] },
    { id:'io', hue:'--io', from:0xA000, to:0xDFFF, name:'I/O — where it touches the world',
      lead:'Sensors, embedded systems, CAD, and one arcade machine built from nothing.',
      body:['A number that is quietly wrong is worse than no number at all. Everything downstream inherits it, every chart drawn from it looks confident, and nobody can tell by looking. Most of the job happens here, at the edge, and almost none of it shows afterwards.',
            'The arcade machine — cabinet, wiring, boards and software — taught more about tolerances than any course did, mostly by not fitting.'],
      words:['Raspberry Pi','Embedded','Sensor integration','SolidWorks','AutoCAD'] },
    { id:'stack', hue:'--stack', from:0xE000, to:0xFFFF, name:'Stack — what it falls back on',
      lead:'Épée. A25, All-American, #103 national. Captain at Northeastern, 2026.',
      body:['Épée is the one weapon where both lights can come on at once. Once the first lamp fires, the box gives the other <strong>forty milliseconds</strong>, and then it has made up its mind. No right of way to argue about afterwards.',
            'Four years of that at national level, and this season taking the team into the national championship — which is mostly logistics and occasionally fencing.'],
      words:['A25','All-American','#103 national','#122 global','14.0 m','40 ms'] },
  ];

  const hex = (n) => '0x' + n.toString(16).toUpperCase().padStart(4, '0');
  const kb = (n) => (n / 1024 < 1 ? n + ' B' : (n / 1024).toFixed(n % 1024 ? 1 : 0) + ' KB');
  const map = document.getElementById('map');
  const banks = document.getElementById('banks');
  const TOTAL = 0x10000;

  for (const s of MAP) {
    const size = s.to - s.from + 1;

    const a = document.createElement('a');
    a.className = 'seg';
    a.href = '#' + s.id;
    a.style.setProperty('--hue', `var(${s.hue})`);
    a.style.minHeight = (34 + (size / TOTAL) * 190).toFixed(0) + 'px';
    a.innerHTML = `<span class="addr">${hex(s.from)}<span class="sz">${kb(size)}</span></span>
                   <span class="nm"></span>`;
    a.querySelector('.nm').textContent = s.name;
    map.append(a);

    const sec = document.createElement('section');
    sec.id = s.id;
    sec.style.setProperty('--hue', `var(${s.hue})`);
    sec.innerHTML =
      `<p class="range"><span>${hex(s.from)} – ${hex(s.to)}</span><span>${kb(size)}</span></p>
       <h2></h2><p class="lead"></p>${s.body.map((p) => `<p>${p}</p>`).join('')}
       <p class="words">${s.words.map(() => '<code></code>').join('')}</p>`;
    sec.querySelector('h2').textContent = s.name;
    sec.querySelector('.lead').textContent = s.lead;
    sec.querySelectorAll('code').forEach((c, i) => (c.textContent = s.words[i]));
    banks.append(sec);
  }

  // The map follows the scroll rather than only responding to clicks, so it always says where
  // you are and not merely where you last tapped.
  const segs = [...map.children];
  const io = new IntersectionObserver((es) => {
    const top = es.filter((e) => e.isIntersecting)
      .sort((a, b) => b.intersectionRatio - a.intersectionRatio)[0];
    if (!top) return;
    const i = MAP.findIndex((s) => s.id === top.target.id);
    segs.forEach((s, n) => (s.dataset.on = String(n === i)));
  }, { rootMargin: '-20% 0px -50% 0px', threshold: [0, .3, .6, 1] });
  for (const s of MAP) io.observe(document.getElementById(s.id));
  segs[0].dataset.on = 'true';
})();
</script>
</body>
</html>
